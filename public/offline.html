<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escudo · sem conexão</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #1b63a2; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0c121e; --card: #141c2b; --ink: #eef2f7; --muted: #94a3b8; --line: #2a3547; --brand: #4895d3; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
            background: var(--bg); color: var(--ink); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
        main { max-width: 22rem; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
        img { width: 56px; height: 56px; }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { color: var(--muted); font-size: .95rem; line-height: 1.5; margin: 0 0 24px; }
        button { font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
        button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="icons/icon-192.png" alt="">
        <h1>Sem conexão</h1>
        <p>O Escudo precisa de internet para mostrar seus dados. Por segurança, nada das suas finanças fica guardado no aparelho.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
