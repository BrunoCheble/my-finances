name: Payment reminders (push)

# Each morning asks the app to send the push of the payments due today. The app sends from 9h (Lisbon) on and
# only once per reminder and day, so the runs at 8, 9 and 10 UTC cover winter/summer time and GitHub's delays.
on:
  schedule:
    - cron: '5 8,9,10 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's reminders
        run: |
          curl -sS --fail -X POST -H "Accept: application/json" "${{ vars.APP_URL }}/payment-reminders/run"
