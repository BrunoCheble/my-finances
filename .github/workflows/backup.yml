name: Backup (encrypted)

# Every night: asks the app for the whole database, already encrypted on the server with the backup public
# key (only the owner's private key opens it), and keeps it as an artifact of the run for 90 days - only
# when the data changed since the last backup. "Changed" = the fingerprint the app sends isn't in the Actions
# cache yet; GitHub drops cache entries unused for 7 days, so unchanged data still gets a fresh copy about
# once a week and there is always a backup within the 90 days.
# To restore: gh run download <run-id> -n escudo-backup, then scripts/decrypt-backup.php.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          name="escudo-backup-$(date -u +%Y-%m-%d)"
          curl -sS --fail -X POST -D headers.txt -o "$name.bin" "${{ vars.APP_URL }}/system-backup"
          # an encrypted backup, not an error page
          [ "$(head -c 9 "$name.bin")" = "ESCUDOBK1" ] || { echo "::error::Not a backup"; exit 1; }
          fingerprint=$(tr -d '\r' < headers.txt | grep -i '^x-backup-fingerprint:' | awk '{print $2}')
          [ -n "$fingerprint" ] || { echo "::error::No fingerprint"; exit 1; }
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          ls -l "$name.bin"

      - name: Same data as the last backup?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .backup-seen
          key: escudo-backup-${{ env.FINGERPRINT }}
          lookup-only: true

      - name: Nothing changed
        if: steps.seen.outputs.cache-hit == 'true'
        run: echo "No changes since the last backup - nothing saved."

      - name: Keep the backup
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: escudo-backup
          path: ${{ env.NAME }}.bin
          retention-days: 90
          if-no-files-found: error

      - name: Remember the data of this backup
        if: steps.seen.outputs.cache-hit != 'true'
        run: echo "$FINGERPRINT" > .backup-seen

      - name: Save the fingerprint
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .backup-seen
          key: escudo-backup-${{ env.FINGERPRINT }}
